name: CD # despliegue a Cloud Run (staging desde develop)

# Se dispara con workflow_run del workflow "CI" de este mismo repo, no con push directo
# a develop: así el despliegue nunca corre sobre un commit cuyas pruebas fallaron
# (disparado directo por push, el job de pruebas y el de despliegue correrían en
# paralelo sobre el mismo evento, sin que uno esperara al otro). github.sha no sirve
# dentro de un workflow disparado por workflow_run -- apunta a la punta de la rama en el
# momento del evento, no al commit que realmente terminó de pasar las pruebas -- por eso
# este workflow usa github.event.workflow_run.head_sha en su lugar, tanto para el
# checkout como para calcular el tag de la imagen.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

concurrency:
  group: cd-perfil-${{ github.ref }}
  cancel-in-progress: false # nunca cancelar un deploy a medias

# Mínimo privilegio: solo lee código y pide el token OIDC para WIF (guía DevOps §2.9).
permissions:
  contents: read
  id-token: write

env:
  REGION: us-east1
  SERVICE: cameia-perfil
  # Repositorio de Artifact Registry ya aprovisionado por Terraform (CM-150).
  AR_REPO: cameia
  # Red y subred de cameia-infra (CM-150), para que Cloud Run llegue por VPC a la IP
  # privada de Cloud SQL y, vía Cloud NAT, salga con la IP fija que CloudAMQP autoriza.
  VPC_NETWORK: cameia-staging
  VPC_SUBNET: cameia-staging-us-east1

jobs:
  desplegar-staging:
    name: Build, publicar imagen y desplegar a Cloud Run (staging)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Credencial temporal vía Workload Identity Federation — misma cuenta de servicio
      # compartida que cameia-gateway (github-action-cameia-backend, CM-156), con su
      # binding WIF condicionado a este repo por separado.
      - name: Autenticar en GCP (WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Autenticar Docker contra Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Tag corto (7 caracteres) calculado a partir del commit que disparó el evento
      # workflow_run, no de GITHUB_SHA -- este último no corresponde a ese commit dentro
      # de un workflow disparado de esa forma.
      - name: Calcular tag de imagen
        id: imagen
        run: |
          SHA_CORTO=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          IMAGEN="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${SHA_CORTO}"
          echo "imagen=${IMAGEN}" >> "$GITHUB_OUTPUT"

      - name: Build de la imagen
        run: docker build -t "${{ steps.imagen.outputs.imagen }}" .

      - name: Publicar imagen en Artifact Registry
        run: docker push "${{ steps.imagen.outputs.imagen }}"

      # --ingress=internal: este servicio no atiende usuarios directamente, solo otro
      # componente interno de la plataforma -- exponerlo directamente a internet
      # ampliaría la superficie de ataque sin ningún beneficio funcional. Antes de este
      # cambio el servicio quedaba con el ingreso por defecto (alcanzable por red desde
      # cualquier origen), aunque sin ningún permiso de invocación otorgado a nadie.
      #
      # min-instances=1: el consumidor de la cola de mensajes vive en el mismo proceso
      # que atiende HTTP, así que no puede escalar a cero sin dejar de consumir
      # mensajes. IP de Cloud SQL fija, solo alcanzable dentro de la VPC. La contraseña
      # de la base y la URL de la cola vienen de secretos gestionados, nunca en texto
      # plano.
      #
      # Sin --allow-unauthenticated: la identidad que ejecuta este despliegue no tiene
      # permiso para cambiar quién puede invocar el servicio, y no se le da ese permiso
      # solo para esto.
      #
      # --service-account usa una identidad de ejecución propia de Perfil, no la cuenta
      # por defecto de Compute Engine: esa cuenta también la usa Entrevista, y ambas
      # compartían acceso a los secretos de la otra (contraseña de base de datos y URL
      # de RabbitMQ) sin necesitarlo. La cuenta dedicada solo puede leer los dos secretos
      # que este servicio usa de verdad.
      - name: Desplegar a Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image="${{ steps.imagen.outputs.imagen }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --ingress=internal \
            --min-instances=1 \
            --max-instances=2 \
            --service-account="cameia-perfil-run@cameia-e245f.iam.gserviceaccount.com" \
            --network="${{ env.VPC_NETWORK }}" \
            --subnet="${{ env.VPC_SUBNET }}" \
            --vpc-egress=all-traffic \
            --set-env-vars="SPRING_DATASOURCE_URL=jdbc:postgresql://10.20.0.3:5432/cameia_perfil,SPRING_DATASOURCE_USERNAME=cameia_perfil" \
            --set-secrets="SPRING_DATASOURCE_PASSWORD=cloudsql-staging-perfil-password:latest,SPRING_RABBITMQ_ADDRESSES=rabbitmq-amqps-url:latest"

      - name: URL del servicio desplegado
        run: gcloud run services describe "${{ env.SERVICE }}" --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ env.REGION }}" --format="value(status.url)"

      # Smoke test (Anexo_Restricciones_Atributos_Calidad.pdf DPL-02: la promocion de un
      # digest exige "SHA, digest, aprobacion, smoke test y rollback"). Este servicio usa
      # --ingress=internal, sin ruta publica alcanzable desde este runner (a diferencia de
      # cameia-gateway, que si tiene Load Balancer publico) -- por eso el smoke test usa
      # la API de administracion de Cloud Run (autenticada con la misma identidad del
      # despliegue) para confirmar que la revision nueva quedo lista y sirve el 100% del
      # trafico, en vez de un curl a un endpoint real. Este repo no tiene perfil "prod":
      # application.yml ya fija ddl-auto=validate en el archivo base (linea 21), sin
      # depender de SPRING_PROFILES_ACTIVE, asi que no aplica aqui el hallazgo verificado
      # en cameia-gateway/cameia-cuentas el 18-sep-2026.
      - name: Smoke test — confirmar que la revisión nueva está lista y sirviendo tráfico
        run: |
          gcloud run services describe "${{ env.SERVICE }}" --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ env.REGION }}" --format=json > /tmp/servicio.json
          cat > /tmp/smoke.py <<'PYEOF'
          import json, sys
          data = json.load(open("/tmp/servicio.json"))
          conditions = data.get("status", {}).get("conditions", [])
          ready = next((c["status"] for c in conditions if c.get("type") == "Ready"), None)
          traffic = data.get("status", {}).get("traffic", [])
          full = [t.get("revisionName") for t in traffic if t.get("percent") == 100]
          print(f"Ready={ready}, revision con 100% de trafico={full}")
          if ready != "True" or not full:
              print("::error::Smoke test FALLA: la revision no quedo Ready o no recibe el 100% del trafico.")
              sys.exit(1)
          print("Smoke test PASA.")
          PYEOF
          python3 /tmp/smoke.py

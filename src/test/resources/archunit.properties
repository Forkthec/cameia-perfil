# Con el proyecto recien creado, casi todos los paquetes estan vacios y varias reglas de
# ArquitecturaTest no tienen clases que evaluar. Eso es lo esperado: las reglas se instalan
# ANTES de que exista codigo que las incumpla, que es el momento barato de ponerlas.
#
# Sin esta linea ArchUnit falla con "failed to check any classes" y la suite se pondria roja
# por un motivo que no es un defecto.
#
# QUITAR esta propiedad cuando los paquetes tengan clases: a partir de ese momento, una regla
# que no evalua nada suele significar que el paquete del that() esta mal escrito, y conviene
# que eso falle en vez de pasar en silencio.
archRule.failOnEmptyShould=false
